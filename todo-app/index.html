<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TaskPilot</title>
<meta name="theme-color" content="#6c5ce7" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===== AUTH SCREEN ===== -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <img src="icon.svg" alt="" class="brand-icon" />
      <h1>TaskPilot</h1>
    </div>
    <p class="brand-tagline">Your synced to-do list, reminders &amp; voice notes.</p>

    <div id="authError" class="auth-error hidden"></div>

    <form id="authForm">
      <label>Email
        <input type="email" id="authEmail" autocomplete="email" required />
      </label>
      <label>Password
        <input type="password" id="authPassword" autocomplete="current-password" required minlength="6" />
      </label>
      <button type="submit" id="authSubmitBtn" class="primary-btn">Log in</button>
    </form>

    <button id="authToggleModeBtn" class="link-btn">Need an account? Sign up</button>
    <button id="authResetBtn" class="link-btn subtle">Forgot password?</button>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="appScreen" class="app-screen hidden">

  <header class="app-header">
    <div class="header-left">
      <img src="icon.svg" alt="" class="brand-icon small" />
      <span class="app-title">TaskPilot</span>
    </div>
    <div class="header-right">
      <span id="userEmailLabel" class="user-email"></span>
      <button id="themeToggleBtn" class="icon-btn" title="Toggle theme">🌙</button>
      <button id="logoutBtn" class="icon-btn" title="Log out">⏻</button>
    </div>
  </header>

  <!-- Quick add -->
  <section class="quick-add">
    <form id="quickAddForm">
      <input type="text" id="quickAddInput" placeholder="Add a task… or tap the mic to speak" autocomplete="off" />
      <button type="button" id="micBtn" class="icon-btn mic-btn" title="Speak a task">🎤</button>
      <button type="submit" class="icon-btn add-btn" title="Add task">➕</button>
    </form>
    <div class="quick-add-row">
      <select id="quickAddCategory"></select>
      <input type="date" id="quickAddDate" />
      <input type="time" id="quickAddTime" />
      <select id="quickAddPriority">
        <option value="low">Low priority</option>
        <option value="medium" selected>Medium priority</option>
        <option value="high">High priority</option>
      </select>
    </div>
    <div id="micStatus" class="mic-status hidden">🎙️ Listening… speak your task</div>
  </section>

  <!-- Filters -->
  <section class="filters">
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="today">Today</button>
      <button class="filter-tab" data-filter="upcoming">Upcoming</button>
      <button class="filter-tab" data-filter="overdue">Overdue</button>
      <button class="filter-tab" data-filter="completed">Completed</button>
    </div>
    <div class="category-chip-row" id="categoryChipRow"></div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="🔍 Search tasks…" />
      <button id="manageCategoriesBtn" class="link-btn">Manage categories</button>
    </div>
  </section>

  <!-- Task list -->
  <main class="task-list-wrap">
    <div id="taskCounts" class="task-counts"></div>
    <ul id="taskList" class="task-list"></ul>
    <div id="emptyState" class="empty-state hidden">
      <p>Nothing here. Add a task above, or say one out loud with the mic 🎤</p>
    </div>
  </main>

  <div id="syncStatus" class="sync-status"></div>
</div>

<!-- ===== TASK DETAIL / EDIT MODAL ===== -->
<div id="taskModal" class="modal hidden">
  <div class="modal-card">
    <h2>Edit task</h2>
    <form id="taskModalForm">
      <label>Title
        <input type="text" id="modalTitle" required />
      </label>
      <label>Notes
        <div class="notes-row">
          <textarea id="modalNotes" rows="3" placeholder="Add details… or dictate with the mic"></textarea>
          <button type="button" id="modalMicBtn" class="icon-btn mic-btn" title="Dictate notes">🎤</button>
        </div>
      </label>
      <div class="modal-grid">
        <label>Category
          <select id="modalCategory"></select>
        </label>
        <label>Priority
          <select id="modalPriority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label>Due date
          <input type="date" id="modalDate" />
        </label>
        <label>Due time
          <input type="time" id="modalTime" />
        </label>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="modalReminder" />
        Remind me at the due date/time (browser notification)
      </label>
      <div class="modal-actions">
        <button type="button" id="modalDeleteBtn" class="danger-btn">Delete</button>
        <div class="modal-actions-right">
          <button type="button" id="modalCancelBtn" class="link-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- ===== CATEGORY MANAGER MODAL ===== -->
<div id="categoryModal" class="modal hidden">
  <div class="modal-card">
    <h2>Manage categories</h2>
    <ul id="categoryManageList" class="category-manage-list"></ul>
    <form id="addCategoryForm" class="add-category-form">
      <input type="text" id="newCategoryName" placeholder="New category name" required />
      <input type="color" id="newCategoryColor" value="#6c5ce7" />
      <button type="submit" class="primary-btn">Add</button>
    </form>
    <div class="modal-actions">
      <div class="modal-actions-right">
        <button type="button" id="categoryModalCloseBtn" class="primary-btn">Done</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
