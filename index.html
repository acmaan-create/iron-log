<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6ecd9">
<title>Iron Log — Gym Tracker</title>
<script>
(function () {
  try {
    var raw = localStorage.getItem("ironlog.theme.v1");
    var theme = raw ? JSON.parse(raw) : null;
    if (theme) document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">IRON</span><span class="brand-mark-accent">LOG</span>
  </div>
  <div class="topbar-right">
    <div class="streak-pill" id="headerStreak">
      <span class="flame">🔥</span><span id="headerStreakVal">0</span>
    </div>
    <button type="button" class="gear-btn" id="gearBtn">⚙️</button>
  </div>
</header>
<div class="greeting hidden" id="greeting"></div>

<!-- PROFILE PANEL -->
<div class="overlay hidden" id="profileOverlay">
  <div class="panel card">
    <div class="row-between">
      <label class="field-label">Your Profile</label>
      <button type="button" class="text-btn" id="closeProfile">Close</button>
    </div>

    <label class="field-label">Theme</label>
    <div class="theme-grid" id="themeGroup">
      <button type="button" class="theme-swatch" data-value="cream">
        <span class="swatch-preview"><span style="background:#f6ecd9"></span><span style="background:#c96a1f"></span></span>
        Cream &amp; Gold
      </button>
      <button type="button" class="theme-swatch" data-value="onyx">
        <span class="swatch-preview"><span style="background:#15171c"></span><span style="background:#d4af37"></span></span>
        Midnight Onyx
      </button>
      <button type="button" class="theme-swatch" data-value="navy">
        <span class="swatch-preview"><span style="background:#f4f1ea"></span><span style="background:#1d3557"></span></span>
        Ivory Navy
      </button>
      <button type="button" class="theme-swatch" data-value="emerald">
        <span class="swatch-preview"><span style="background:#181c1a"></span><span style="background:#2f9e6e"></span></span>
        Charcoal Emerald
      </button>
    </div>

    <label class="field-label small-label">Name</label>
    <input type="text" id="profName" class="text-input" placeholder="Your name">

    <label class="field-label small-label">Gender</label>
    <div class="btn-group" id="genderGroup">
      <button type="button" class="choice-btn small" data-value="Male">🚹<span>Male</span></button>
      <button type="button" class="choice-btn small" data-value="Female">🚺<span>Female</span></button>
      <button type="button" class="choice-btn small" data-value="Other">⚧<span>Other</span></button>
    </div>

    <label class="field-label small-label">Age</label>
    <input type="number" id="profAge" class="text-input" min="1" max="120" placeholder="e.g. 28">

    <button type="button" id="saveProfileBtn" class="save-btn">Save Profile</button>
  </div>
</div>

<main id="app">

  <!-- LOG TAB -->
  <section class="view" id="view-log">
    <div class="card date-card">
      <label class="field-label">Date</label>
      <input type="date" id="logDate" class="date-input">
    </div>

    <div class="card">
      <div class="row-between">
        <label class="field-label">Where did you train?</label>
        <button type="button" class="text-btn danger hidden" id="deleteWorkoutBtn">Delete Workout</button>
      </div>
      <div class="btn-group" id="gymGroup">
        <button type="button" class="choice-btn" data-value="Personal">🏠<span>Personal Gym</span></button>
        <button type="button" class="choice-btn" data-value="Office">🏢<span>Office Gym</span></button>
      </div>
    </div>

    <div class="card">
      <label class="field-label">Body parts targeted</label>
      <div class="btn-grid" id="bodyPartGroup">
        <button type="button" class="choice-btn small" data-value="Chest">💪<span>Chest</span></button>
        <button type="button" class="choice-btn small" data-value="Back">🔙<span>Back</span></button>
        <button type="button" class="choice-btn small" data-value="Shoulders">🎯<span>Shoulders</span></button>
        <button type="button" class="choice-btn small" data-value="Arms">💪<span>Arms</span></button>
        <button type="button" class="choice-btn small" data-value="Legs">🦵<span>Legs</span></button>
        <button type="button" class="choice-btn small" data-value="Core">🔥<span>Core</span></button>
        <button type="button" class="choice-btn small" data-value="Full Body">⚡<span>Full Body</span></button>
      </div>
      <div id="exerciseExamples" class="exercise-examples"></div>
    </div>

    <div class="card">
      <div class="row-between">
        <label class="field-label">Cardio</label>
        <div class="row-between" style="gap:10px;">
          <button type="button" class="text-btn danger hidden" id="deleteCardioBtn">Delete Cardio</button>
          <label class="switch">
            <input type="checkbox" id="cardioToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div id="cardioPanel" class="cardio-panel hidden">
        <label class="field-label small-label">Type</label>
        <div class="btn-group">
          <button type="button" class="choice-btn small" data-value="Indoor Running">🏃<span>Indoor</span></button>
          <button type="button" class="choice-btn small" data-value="Outdoor Running">🌳<span>Outdoor</span></button>
          <button type="button" class="choice-btn small" data-value="HIIT">⚡<span>HIIT</span></button>
        </div>
        <input type="hidden" id="cardioType">

        <label class="field-label small-label">Duration (minutes)</label>
        <input type="number" id="cardioDuration" class="text-input" min="0" max="300" placeholder="e.g. 30">

        <label class="field-label small-label">Effort <span id="effortVal">5</span>/10</label>
        <input type="range" id="cardioEffort" min="1" max="10" value="5" class="effort-slider">
        <div class="effort-labels"><span>Easy</span><span>Max</span></div>
      </div>
    </div>

    <div class="card">
      <label class="field-label small-label">Notes (optional)</label>
      <textarea id="notes" class="text-input notes-input" rows="2" placeholder="How did it feel?"></textarea>
    </div>

    <button id="saveBtn" class="save-btn">Save Workout</button>
    <div id="saveMsg" class="save-msg hidden">Saved ✓</div>
  </section>

  <!-- CALENDAR TAB -->
  <section class="view hidden" id="view-calendar">
    <div class="card">
      <div class="cal-nav">
        <button id="prevMonth" class="nav-btn">‹</button>
        <div id="calMonthLabel" class="cal-month-label"></div>
        <button id="nextMonth" class="nav-btn">›</button>
      </div>
      <div class="cal-weekdays">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div id="calGrid" class="cal-grid"></div>
      <div class="cal-legend">
        <span class="legend-item"><i class="dot personal"></i>Personal</span>
        <span class="legend-item"><i class="dot office"></i>Office</span>
        <span class="legend-item"><i class="dot cardio"></i>Cardio</span>
      </div>
    </div>

    <div class="card" id="dayDetailCard" style="display:none;">
      <div class="row-between">
        <div id="dayDetailTitle" class="field-label"></div>
        <button id="closeDayDetail" class="text-btn">Close</button>
      </div>
      <div id="dayDetailBody"></div>
      <div class="day-detail-actions" id="dayDetailActions"></div>
    </div>
  </section>

  <!-- STATS TAB -->
  <section class="view hidden" id="view-stats">
    <div class="card stat-hero">
      <div class="stat-hero-item">
        <div class="stat-hero-num" id="currentStreakNum">0</div>
        <div class="stat-hero-label">🔥 Current Streak</div>
      </div>
      <div class="stat-hero-item">
        <div class="stat-hero-num" id="bestStreakNum">0</div>
        <div class="stat-hero-label">🏆 Best Streak</div>
      </div>
    </div>

    <div class="card">
      <label class="field-label">This Week</label>
      <div class="week-bar" id="weekBar"></div>
      <div class="week-count" id="weekCountLabel">0 / 7 days</div>
    </div>

    <div class="card score-card">
      <label class="field-label">Weekly Health Score</label>
      <div class="score-ring-wrap">
        <svg viewBox="0 0 120 120" class="score-ring">
          <circle cx="60" cy="60" r="52" class="ring-bg"></circle>
          <circle cx="60" cy="60" r="52" class="ring-fg" id="ringFg"></circle>
        </svg>
        <div class="score-ring-val" id="scoreVal">0%</div>
      </div>
      <div class="score-sub" id="scoreSub">Train more days this week to raise your score</div>
    </div>

    <div class="card">
      <label class="field-label">This Month</label>
      <div class="month-stats">
        <div class="month-stat"><span id="monthDays">0</span><small>Days trained</small></div>
        <div class="month-stat"><span id="monthCardio">0</span><small>Cardio sessions</small></div>
        <div class="month-stat"><span id="monthMins">0</span><small>Cardio mins</small></div>
      </div>
    </div>

    <div class="card">
      <label class="field-label">Personal vs Office Gym</label>
      <div id="gymSplit" class="bp-freq"></div>
      <div class="score-sub" id="gymSplitSub"></div>
    </div>

    <div class="card">
      <label class="field-label">Body Part Frequency (30 days)</label>
      <div id="bodyPartFreq" class="bp-freq"></div>
    </div>

    <div class="card">
      <label class="field-label">Fun Insights</label>
      <div id="insightsGrid" class="insights-grid"></div>
    </div>
  </section>

  <!-- WEIGHT TAB -->
  <section class="view hidden" id="view-weight">
    <div class="card">
      <label class="field-label">Log Your Weight</label>
      <div class="weight-input-row">
        <input type="date" id="weightDate" class="date-input">
        <input type="number" id="weightValue" class="text-input" step="0.1" min="0" placeholder="kg">
      </div>
      <button type="button" id="saveWeightBtn" class="save-btn">Add Weight Entry</button>
    </div>

    <div class="card">
      <label class="field-label">Trend</label>
      <div id="weightChartWrap" class="weight-chart-wrap"></div>
      <div class="weight-summary" id="weightSummary"></div>
    </div>

    <div class="card">
      <label class="field-label">History</label>
      <div id="weightHistory" class="weight-history"></div>
    </div>
  </section>

  <!-- COACH TAB -->
  <section class="view hidden" id="view-coach">
    <div class="card">
      <label class="field-label">Exercise Level</label>
      <div class="btn-group" id="coachDifficultyGroup">
        <button type="button" class="choice-btn small" data-value="Simple">🥉<span>Simple</span></button>
        <button type="button" class="choice-btn small" data-value="Medium">🥈<span>Medium</span></button>
        <button type="button" class="choice-btn small" data-value="Advanced">🥇<span>Advanced</span></button>
      </div>
    </div>

    <div class="card">
      <label class="field-label small-label" style="margin-top:0;">Total workout time (minutes)</label>
      <input type="number" id="coachTime" class="text-input" min="10" max="180" step="5" placeholder="e.g. 45">
    </div>

    <div class="card">
      <label class="field-label">Your Goal</label>
      <div class="btn-grid" id="coachGoalGroup">
        <button type="button" class="choice-btn small" data-value="Lose Weight">🔥<span>Lose Weight</span></button>
        <button type="button" class="choice-btn small" data-value="Build Muscle">💪<span>Build Muscle</span></button>
        <button type="button" class="choice-btn small" data-value="Get Stronger">🏋️<span>Get Stronger</span></button>
        <button type="button" class="choice-btn small" data-value="Marathon Training">🏃<span>Marathon Training</span></button>
        <button type="button" class="choice-btn small" data-value="Tone &amp; Sculpt">✨<span>Tone &amp; Sculpt</span></button>
      </div>
    </div>

    <div class="card">
      <label class="field-label">Body Parts Targeted <span class="field-hint">(pick up to 2)</span></label>
      <div class="btn-grid" id="coachBodyPartGroup">
        <button type="button" class="choice-btn small" data-value="Chest">💪<span>Chest</span></button>
        <button type="button" class="choice-btn small" data-value="Back">🔙<span>Back</span></button>
        <button type="button" class="choice-btn small" data-value="Shoulders">🎯<span>Shoulders</span></button>
        <button type="button" class="choice-btn small" data-value="Arms">💪<span>Arms</span></button>
        <button type="button" class="choice-btn small" data-value="Legs">🦵<span>Legs</span></button>
        <button type="button" class="choice-btn small" data-value="Core">🔥<span>Core</span></button>
        <button type="button" class="choice-btn small" data-value="Full Body">⚡<span>Full Body</span></button>
      </div>
    </div>

    <div class="card">
      <label class="field-label">Intensity</label>
      <div class="btn-group" id="coachIntensityGroup">
        <button type="button" class="choice-btn small" data-value="Light">🙂<span>Light</span></button>
        <button type="button" class="choice-btn small" data-value="Moderate">😅<span>Moderate</span></button>
        <button type="button" class="choice-btn small" data-value="High">🥵<span>High</span></button>
      </div>
    </div>

    <div class="card">
      <div class="row-between">
        <label class="field-label">Include Cardio?</label>
        <label class="switch">
          <input type="checkbox" id="coachCardioToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div id="coachCardioPanel" class="cardio-panel hidden">
        <label class="field-label small-label">Type</label>
        <div class="btn-group" id="coachCardioTypeGroup">
          <button type="button" class="choice-btn small" data-value="Indoor Running">🏃<span>Indoor</span></button>
          <button type="button" class="choice-btn small" data-value="Outdoor Running">🌳<span>Outdoor</span></button>
          <button type="button" class="choice-btn small" data-value="HIIT">⚡<span>HIIT</span></button>
        </div>
        <label class="field-label small-label">Duration (minutes, out of your total time)</label>
        <input type="number" id="coachCardioDuration" class="text-input" min="5" max="120" step="5" placeholder="e.g. 15">
      </div>
    </div>

    <div id="coachWarning" class="score-sub hidden" style="color: var(--danger); text-align:center; margin-bottom: 10px;"></div>
    <button type="button" id="coachGenerateBtn" class="save-btn">Generate Workout</button>

    <div class="card hidden" id="coachResultCard">
      <label class="field-label" id="coachResultTitle">Your Workout</label>
      <div id="coachResultMeta" class="score-sub" style="margin-bottom: 12px;"></div>
      <div id="coachExerciseList" class="coach-exercise-list"></div>
      <div id="coachCardioBlock" class="coach-cardio-block hidden"></div>
      <div class="coach-action-row">
        <button type="button" id="coachShuffleBtn" class="text-btn">🔀 Shuffle Exercises</button>
        <button type="button" id="coachLogBtn" class="text-btn">📝 Log This Workout</button>
      </div>
    </div>
  </section>

  <!-- EAT OUT TAB -->
  <section class="view hidden" id="view-eatout">
    <div class="card">
      <label class="field-label">Log Today's Meal</label>
      <input type="date" id="eatoutDate" class="date-input" style="margin-bottom:12px;">

      <label class="field-label small-label" style="margin-top:0;">Did you eat out, or was it home-made?</label>
      <div class="btn-group" id="eatoutTypeGroup">
        <button type="button" class="choice-btn" data-value="eatout">🍽️<span>Ate Out</span></button>
        <button type="button" class="choice-btn" data-value="home">🏠<span>Home-Made</span></button>
      </div>

      <label class="field-label small-label">Meal</label>
      <div class="btn-group" id="eatoutMealGroup">
        <button type="button" class="choice-btn small" data-value="Breakfast">🌅<span>Breakfast</span></button>
        <button type="button" class="choice-btn small" data-value="Lunch">☀️<span>Lunch</span></button>
        <button type="button" class="choice-btn small" data-value="Dinner">🌙<span>Dinner</span></button>
        <button type="button" class="choice-btn small" data-value="Snack">🍿<span>Snack</span></button>
      </div>

      <div id="eatoutOutFields">
      <label class="field-label small-label">What did you eat? <span class="field-hint">(pick as many as you like)</span></label>
      <div class="btn-grid" id="eatoutDishGroup">
        <button type="button" class="choice-btn small" data-value="🍛 Biryani">🍛<span>Biryani</span></button>
        <button type="button" class="choice-btn small" data-value="🍗 Butter Chicken">🍗<span>Butter Chicken</span></button>
        <button type="button" class="choice-btn small" data-value="🧀 Paneer Masala">🧀<span>Paneer Masala</span></button>
        <button type="button" class="choice-btn small" data-value="🫓 Chole Bhature">🫓<span>Chole Bhature</span></button>
        <button type="button" class="choice-btn small" data-value="🍞 Pav Bhaji">🍞<span>Pav Bhaji</span></button>
        <button type="button" class="choice-btn small" data-value="🥞 Dosa">🥞<span>Dosa</span></button>
        <button type="button" class="choice-btn small" data-value="🍚 Idli Sambar">🍚<span>Idli Sambar</span></button>
        <button type="button" class="choice-btn small" data-value="🥔 Vada Pav">🥔<span>Vada Pav</span></button>
        <button type="button" class="choice-btn small" data-value="🥟 Momos">🥟<span>Momos</span></button>
        <button type="button" class="choice-btn small" data-value="🍕 Pizza">🍕<span>Pizza</span></button>
        <button type="button" class="choice-btn small" data-value="🍔 Burger">🍔<span>Burger</span></button>
        <button type="button" class="choice-btn small" data-value="🍜 Noodles">🍜<span>Noodles</span></button>
        <button type="button" class="choice-btn small" data-value="🥡 Manchurian">🥡<span>Manchurian</span></button>
        <button type="button" class="choice-btn small" data-value="🌯 Shawarma">🌯<span>Shawarma</span></button>
        <button type="button" class="choice-btn small" data-value="🌯 Kathi Roll">🌯<span>Kathi Roll</span></button>
        <button type="button" class="choice-btn small" data-value="🍽️ Thali">🍽️<span>Thali</span></button>
        <button type="button" class="choice-btn small" data-value="🍝 Pasta">🍝<span>Pasta</span></button>
        <button type="button" class="choice-btn small" data-value="🍣 Sushi">🍣<span>Sushi</span></button>
        <button type="button" class="choice-btn small" data-value="🍢 Tandoori/Kebab">🍢<span>Tandoori/Kebab</span></button>
        <button type="button" class="choice-btn small" data-value="🥘 Chaat/Samosa">🥘<span>Chaat/Samosa</span></button>
        <button type="button" class="choice-btn small" data-value="🍨 Dessert">🍨<span>Dessert</span></button>
      </div>
      <input type="text" id="eatoutDishOther" class="text-input" placeholder="Other dish(es)? Type here, comma-separated" style="margin-top:10px;">

      <label class="field-label small-label">Cuisine <span class="field-hint">(optional — pick instead of, or alongside, dishes)</span></label>
      <div class="btn-grid" id="eatoutCuisineGroup">
        <button type="button" class="choice-btn small" data-value="North Indian">🇮🇳<span>North Indian</span></button>
        <button type="button" class="choice-btn small" data-value="South Indian">🥥<span>South Indian</span></button>
        <button type="button" class="choice-btn small" data-value="Chinese / Indo-Chinese">🥢<span>Chinese</span></button>
        <button type="button" class="choice-btn small" data-value="Italian">🍝<span>Italian</span></button>
        <button type="button" class="choice-btn small" data-value="Mexican">🌮<span>Mexican</span></button>
        <button type="button" class="choice-btn small" data-value="Middle Eastern">🧆<span>Middle Eastern</span></button>
        <button type="button" class="choice-btn small" data-value="Continental">🍱<span>Continental</span></button>
        <button type="button" class="choice-btn small" data-value="Bakery / Desserts">🧁<span>Bakery/Desserts</span></button>
        <button type="button" class="choice-btn small" data-value="Street Food">🛣️<span>Street Food</span></button>
        <button type="button" class="choice-btn small" data-value="Other Asian">🌏<span>Other Asian</span></button>
      </div>

      <label class="field-label small-label">Approx. cost (₹, optional)</label>
      <input type="number" id="eatoutCost" class="text-input" min="0" step="10" placeholder="e.g. 350">
      </div>

      <div id="eatoutHomeFields" class="hidden">
        <label class="field-label small-label">What did you cook? <span class="field-hint">(optional)</span></label>
        <input type="text" id="eatoutHomeNotes" class="text-input" placeholder="e.g. Dal, rice, sabzi">
      </div>

      <div id="eatoutWarning" class="score-sub hidden" style="color: var(--danger); text-align:center; margin-top: 10px;"></div>
      <button type="button" id="eatoutSaveBtn" class="save-btn">Log Meal Out</button>
    </div>

    <div class="card">
      <label class="field-label" id="eatoutScoreCardLabel">This Week's Score</label>
      <div class="score-ring-wrap">
        <svg viewBox="0 0 120 120" class="score-ring">
          <circle cx="60" cy="60" r="52" class="ring-bg"></circle>
          <circle cx="60" cy="60" r="52" class="ring-fg" id="eatoutRingFg"></circle>
        </svg>
        <div class="score-ring-val" id="eatoutScoreVal">0%</div>
      </div>
      <div class="score-sub" id="eatoutScoreSub" style="text-align:center;">Log a meal to see your meter</div>
    </div>

    <div class="card">
      <div id="eatoutInsights" class="insights-grid"></div>
    </div>

    <div class="card">
      <label class="field-label">8-Week Trend</label>
      <div id="eatoutTrend" class="week-bar"></div>
    </div>

    <div class="card">
      <label class="field-label">History</label>
      <div id="eatoutHistory" class="weight-history"></div>
    </div>
  </section>

</main>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="log"><span class="tab-icon">🏋️</span><span>Log</span></button>
  <button class="tab-btn" data-tab="calendar"><span class="tab-icon">📅</span><span>Calendar</span></button>
  <button class="tab-btn" data-tab="stats"><span class="tab-icon">📊</span><span>Stats</span></button>
  <button class="tab-btn" data-tab="weight"><span class="tab-icon">⚖️</span><span>Weight</span></button>
  <button class="tab-btn" data-tab="coach"><span class="tab-icon">🧠</span><span>Coach</span></button>
  <button class="tab-btn" data-tab="eatout"><span class="tab-icon">🍽️</span><span>Eats</span></button>
</nav>

<script src="app.js?v=5"></script>
</body>
</html>
